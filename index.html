<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verificación de Certificados - XIII Curso DPI 2026</title>

  <style>
    :root{
      --c-navy:#172736;
      --c-blue:#426583;
      --c-sky:#81c3e3;
      --c-mist:#b9cfdb;
      --ok-bg:#f3fff6;
      --ok-border:#cfead6;
      --ok-text:#0b5d2a;
      --err-bg:#fff5f5;
      --err-border:#ffd4d4;
      --err-text:#b00020;
    }

    *{box-sizing:border-box}
    html, body{height:100%}

    body{
      font-family: Arial, sans-serif;
      text-align:center;
      padding:40px 16px;
      margin:0;
      color:#111;
      background:
        radial-gradient(900px 500px at 20% 10%, rgba(129,195,227,.18), transparent 60%),
        radial-gradient(900px 500px at 80% 30%, rgba(185,207,219,.35), transparent 65%),
        linear-gradient(180deg, #ffffff 0%, var(--c-mist) 100%);
      background-attachment: fixed;
    }

    .box{
      background:#fff;
      border-radius:16px;
      max-width:640px;
      margin:0 auto;
      box-shadow:0 10px 30px rgba(0,0,0,.10);
      overflow:hidden;
      border:1px solid rgba(0,0,0,.04);
    }

    .topbar{
      display:flex;
      align-items:center;
      gap:16px;
      padding:18px 20px;
      background: var(--c-navy);
      color:#fff;
    }

    .logo{
      width:92px;
      height:92px;
      border-radius:50%;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .logo img{
      width:92px;
      height:92px;
      object-fit:cover;
      display:block;
      border-radius:50%;
      border:3px solid rgba(255,255,255,.92);
      box-shadow:0 10px 22px rgba(0,0,0,.28);
    }

    .topbar .t1{
      font-weight:800;
      font-size:18px;
      line-height:1.1;
      margin:0;
      text-align:left;
    }

    .topbar .t2{
      margin:5px 0 0;
      font-size:13px;
      opacity:.9;
      text-align:left;
    }

    .content{ padding:26px 22px 22px; }

    h2{
      margin:0 0 6px;
      font-size:20px;
      color:var(--c-navy);
    }

    .sub{
      margin:0 0 14px;
      color:#334;
      font-size:14px;
    }

    .hint{
      font-size:12px;
      color:#667;
      margin:10px 0 10px;
    }

    input{
      padding:12px 14px;
      width:100%;
      max-width:440px;
      margin:10px 0 10px;
      border:1px solid #cfd6df;
      border-radius:12px;
      font-size:16px;
      outline:none;
      transition: box-shadow .15s, border-color .15s;
    }

    input:focus{
      border-color: var(--c-sky);
      box-shadow:0 0 0 4px rgba(129,195,227,.25);
    }

    button{
      padding:12px 24px;
      background: var(--c-blue);
      color:#fff;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-size:16px;
      font-weight:700;
    }

    .msg{
      margin:18px auto 6px;
      padding:16px;
      border-radius:14px;
      text-align:left;
      border:1px solid #e6e9ee;
      background:#fbfbfc;
      max-width:560px;
    }

    .ok{
      border-color:var(--ok-border);
      background:var(--ok-bg);
      color:var(--ok-text);
    }

    .error{
      border-color:var(--err-border);
      background:var(--err-bg);
      color:var(--err-text);
    }

    .row{
      display:flex;
      justify-content:space-between;
      gap:14px;
      padding:7px 0;
      border-bottom:1px dashed #e8ecf2;
    }

    .k{
      font-weight:800;
      min-width:190px;
    }

    .v{
      text-align:right;
      flex:1;
      word-break:break-word;
    }
    .footer{
  padding:12px 18px 16px;
  color:#6a7785;
  font-size:12px;
  text-align:center;
  margin-top:8px;
}
  </style>
</head>

<body>
  <div class="box">
    <div class="topbar">
      <div class="logo">
        <img src="./logo.png" alt="Logo DPI 2026">
      </div>
      <div>
        <p class="t1">Verificación Oficial de Certificados</p>
        <p class="t2">XIII Curso de Diagnóstico por Imágenes 2026</p>
      </div>
    </div>

    <div class="content">
      <h2>Validación de Certificado</h2>
      <p class="sub">Ingrese el <b>código</b> del certificado para consultar su estado.</p>
      <div class="hint">Ejemplo: DPI26-XX-###</div>

      <input id="codigo" placeholder="Código del certificado" autocomplete="off" />
      <br />
      <button id="btn" onclick="verificar()">Verificar</button>

      <div id="resultado" class="msg" style="display:none;"></div>
      <div class="footer">Sistema oficial de validación digital.</div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyUB8qaHh1r_Ygo1KvMQOKeRuUqlJCRTSMe3fvkuHfNOqVkpnGzrjCYR8Q0Omu-v6Xm/exec";
    const $ = (id) => document.getElementById(id);

    // ✅ Permite verificar presionando ENTER
$("codigo").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    verificar();
  }
});
    function show(html, type){
      const r = $("resultado");
      r.style.display = "block";
      r.className = "msg " + (type || "");
      r.innerHTML = html;
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");
    }

    function row(k,v){
      return `<div class="row"><div class="k">${k}</div><div class="v">${escapeHtml(String(v ?? ""))}</div></div>`;
    }

    function rowHtml(k, htmlValue){
      return `<div class="row"><div class="k">${k}</div><div class="v">${htmlValue}</div></div>`;
    }

    function formatFecha(val){
      if(!val) return "";
      const d = new Date(val);
      if(!isNaN(d.getTime())) return d.toLocaleDateString("es-PE");
      return String(val);
    }

    function isNoRegistra(val){
      const s = String(val ?? "").trim().toLowerCase();
      return !s || s.includes("no registra");
    }

    function temasToListHtml(val){
      const raw = String(val ?? "").trim();
      if(!raw) return "";

      const parts = raw
        .split(/\r?\n|;/g)
        .map(s => s.trim())
        .filter(Boolean);

      if(parts.length <= 1){
        return escapeHtml(raw);
      }

      const items = parts.map(t => `<li>${escapeHtml(t)}</li>`).join("");
      return `<ul style="margin:0; padding-left:18px; text-align:left;">${items}</ul>`;
    }

    async function verificar(){
      const codigo = $("codigo").value.trim();
      if(!codigo){
        show("Debe ingresar el código.", "error");
        return;
      }

      const btn = $("btn");
      btn.disabled = true;
      btn.textContent = "Verificando...";

      try{
        const url = `${API_URL}?codigo=${encodeURIComponent(codigo)}`;
        const res = await fetch(url);
        const data = await res.json();

        if(data.error){
          show("No encontrado.", "error");
          return;
        }

        const tipo = String(data["Tipo de Certificado"] || "").trim().toLowerCase();
        let html = `<b>✅ Certificado encontrado</b><br><br>` +
                   row("Código", data["Código"]);

        // DOCENTE
        if (tipo.includes("docente")) {
          const titulo = data["Título"] || "";
          const nombreDoc = `${titulo} ${data["Nombres completos"]} ${data["Apellidos completos"]}`.trim();
          const rne = data["RNE"];

          html +=
            row("Docente", nombreDoc) +
            row("CMP", data["CMP"]) +
            (!isNoRegistra(data["Especialidad"]) ? row("Especialidad", data["Especialidad"]) : "") +
            (!isNoRegistra(rne) ? row("RNE", rne) : "") +
            rowHtml("Tema dictado", temasToListHtml(data["Tema dictado"])) +
            row("Fecha de emisión", formatFecha(data["Fecha de emisión"]));

        // COMITÉ
        } else if (tipo.includes("comité") || tipo.includes("comite")) {
          const nombre = `${data["Nombres completos"] || ""} ${data["Apellidos completos"] || ""}`.trim();

          html +=
            row("Miembro", nombre) +
            row("Cargo", data["Cargo"]) +
            row("Tipo de certificado", data["Tipo de Certificado"]) +
            row("Fecha de emisión", formatFecha(data["Fecha de emisión"]));

        // PARTICIPANTES (Opción A: minimalista)
        } else {
          const nombre = `${data["Nombres completos"] || ""} ${data["Apellidos completos"] || ""}`.trim();

          html +=
            row("Participante", nombre) +
            row("Estado", data["Estado"]) +
            row("Tipo de certificado", data["Tipo de Certificado"]) +
            row("Fecha de emisión", formatFecha(data["Fecha de emisión"]));
        }

        // Fondo verde para encontrados
        show(html, "ok");

      } catch(err){
        show("Error de conexión.", "error");
      } finally{
        btn.disabled = false;
        btn.textContent = "Verificar";
      }
    }
  </script>
</body>
</html>
