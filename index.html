<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verificación de Certificados - XIII Curso DPI 2026</title>

  <style>
    :root{
      --c-navy:#172736;   /* principal */
      --c-blue:#426583;   /* botones */
      --c-sky:#81c3e3;    /* acento */
      --c-mist:#b9cfdb;   /* fondo suave */
      --ok-bg:#f3fff6;
      --ok-border:#cfead6;
      --ok-text:#0b5d2a;
      --err-bg:#fff5f5;
      --err-border:#ffd4d4;
      --err-text:#b00020;
    }

    *{box-sizing:border-box}

    html, body{height:100%}

    body{
      font-family: Arial, sans-serif;
      text-align:center;
      padding:40px 16px;
      margin:0;
      color:#111;

      background:
        radial-gradient(900px 500px at 20% 10%, rgba(129,195,227,.18), transparent 60%),
        radial-gradient(900px 500px at 80% 30%, rgba(185,207,219,.35), transparent 65%),
        linear-gradient(180deg, #ffffff 0%, var(--c-mist) 100%);
      background-attachment: fixed;
    }

    .box{
      background:#fff;
      border-radius:16px;
      max-width:640px;
      margin:0 auto;
      box-shadow:0 10px 30px rgba(0,0,0,.10);
      overflow:hidden;
      border:1px solid rgba(0,0,0,.04);
    }

    .topbar{
      display:flex;
      align-items:center;
      gap:16px;
      padding:18px 20px;
      background: var(--c-navy);
      color:#fff;
    }

    .logo{
      width:92px;
      height:92px;
      border-radius:50%;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .logo img{
      width:92px;
      height:92px;
      object-fit:cover;
      display:block;
      border-radius:50%;
      border:3px solid rgba(255,255,255,.92);
      box-shadow:0 10px 22px rgba(0,0,0,.28);
    }

    .topbar .t1{
      font-weight:800;
      font-size:18px;
      line-height:1.1;
      margin:0;
      text-align:left;
    }

    .topbar .t2{
      margin:5px 0 0;
      font-size:13px;
      opacity:.9;
      text-align:left;
    }

    .content{
      padding:26px 22px 22px;
    }

    h2{
      margin:0 0 6px;
      font-size:20px;
      color:var(--c-navy);
    }

    .sub{
      margin:0 0 14px;
      color:#334;
      font-size:14px;
    }

    .hint{
      font-size:12px;
      color:#667;
      margin:10px 0 10px;
    }

    input{
      padding:12px 14px;
      width:100%;
      max-width:440px;
      margin:10px 0 10px;
      border:1px solid #cfd6df;
      border-radius:12px;
      font-size:16px;
      outline:none;
      transition: box-shadow .15s, border-color .15s;
    }
    input:focus{
      border-color: var(--c-sky);
      box-shadow:0 0 0 4px rgba(129,195,227,.25);
    }

    button{
      padding:12px 24px;
      background: var(--c-blue);
      color:#fff;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-size:16px;
      font-weight:700;
      transition: transform .05s, filter .15s;
    }
    button:hover{filter:brightness(1.05)}
    button:active{transform:scale(.99)}
    button:disabled{opacity:.6;cursor:not-allowed}

    .msg{
      margin:18px auto 6px;
      padding:16px;
      border-radius:14px;
      text-align:left;
      border:1px solid #e6e9ee;
      background:#fbfbfc;
      max-width:560px;
    }

    .error{
      border-color:var(--err-border);
      background:var(--err-bg);
      color:var(--err-text);
    }

    .ok{
      border-color:var(--ok-border);
      background:var(--ok-bg);
      color:var(--ok-text);
    }

    .row{
      display:flex;
      justify-content:space-between;
      gap:14px;
      padding:7px 0;
      border-bottom:1px dashed #e8ecf2;
    }
    .row:last-child{border-bottom:none}

    .k{
      color:#2c3b4a;
      font-weight:800;
      min-width:190px;
    }

    .v{
      color:#111;
      text-align:right;
      flex:1;
      word-break:break-word;
    }

    .footer{
      padding:12px 18px 16px;
      color:#6a7785;
      font-size:12px;
    }

    @media (max-width: 520px){
      body{ padding:18px 12px; }
      .topbar{ padding:14px 14px; gap:12px; }
      .logo{ width:72px; height:72px; }
      .logo img{ width:72px; height:72px; }
      .content{ padding:20px 14px 16px; }

      .row{
        flex-direction: column;
        align-items: flex-start;
        gap:6px;
      }
      .k{ min-width: 0; text-align:left; }
      .v{
        width: 100%;
        text-align:left;
        white-space: normal;
        word-break: break-word;
      }

      input{ max-width: 100%; }
      button{ width: 100%; max-width: 440px; }
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="topbar">
      <div class="logo" title="DPI 2026">
        <img src="./logo.png" alt="Logo DPI 2026">
      </div>
      <div>
        <p class="t1">Verificación Oficial de Certificados</p>
        <p class="t2">XIII Curso de Diagnóstico por Imágenes 2026</p>
      </div>
    </div>

    <div class="content">
      <h2>Validación de Certificado</h2>
      <p class="sub">Ingrese el <b>código</b> del certificado para consultar su estado.</p>

      <div class="hint">Ejemplo: DPI26-XX-###</div>

      <input id="codigo" placeholder="Código del certificado" autocomplete="off" />
      <br />
      <button id="btn" onclick="verificar()">Verificar</button>

      <div id="resultado" class="msg" style="display:none;"></div>

      <div class="footer">Sistema oficial de validación digital.</div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyUB8qaHh1r_Ygo1KvMQOKeRuUqlJCRTSMe3fvkuHfNOqVkpnGzrjCYR8Q0Omu-v6Xm/exec";
    const $ = (id) => document.getElementById(id);

    function show(html, type){
      const r = $("resultado");
      r.style.display = "block";
      r.className = "msg " + (type || "");
      r.innerHTML = html;
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
        .replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    function row(k,v){
      return `<div class="row"><div class="k">${k}</div><div class="v">${escapeHtml(String(v ?? ""))}</div></div>`;
    }

    function rowHtml(k, htmlValue){
      // htmlValue viene ya armado (y seguro)
      return `<div class="row"><div class="k">${k}</div><div class="v">${htmlValue}</div></div>`;
    }

    function formatFecha(val){
      if(!val) return "";
      const d = new Date(val);
      if(!isNaN(d.getTime())) return d.toLocaleDateString("es-PE");
      return String(val);
    }

    function isNoRegistra(val){
      const s = String(val ?? "").trim().toLowerCase();
      return !s || s.includes("no registra");
    }

    // ✅ Convierte temas con \n, ; o , en lista (bullets)
    function temasToListHtml(val){
      const raw = String(val ?? "").trim();
      if(!raw) return "";

      // separadores: saltos de línea, punto y coma, y comas (pero comas solo si realmente hay varias)
      const parts = raw
        .split(/\r?\n|;/g)               // primero por salto de línea o ;
        .flatMap(p => p.split(/,(?=\s*[A-ZÁÉÍÓÚÑ])/g)) // luego por coma antes de MAYÚSCULA (heurística suave)
        .map(s => s.trim())
        .filter(Boolean);

      if(parts.length <= 1){
        return escapeHtml(raw);
      }

      const items = parts.map(t => `<li>${escapeHtml(t)}</li>`).join("");
      return `<ul style="margin:0; padding-left:18px; text-align:left;">${items}</ul>`;
    }

    $("codigo").addEventListener("keydown", (e) => {
      if(e.key === "Enter") verificar();
    });

    async function verificar(){
      const codigo = $("codigo").value.trim();

      if(!codigo){
        show("Debe ingresar el <b>código del certificado</b>.", "error");
        return;
      }

      const btn = $("btn");
      btn.disabled = true;
      btn.textContent = "Verificando...";

      try{
        const url = `${API_URL}?codigo=${encodeURIComponent(codigo)}`;
        const res = await fetch(url, { method:"GET", cache:"no-store" });
        const text = await res.text();

        let data;
        try{ data = JSON.parse(text); } catch(e){
          show("Error: respuesta no válida del servidor.", "error");
          return;
        }

        if(data.error){
          show(`❌ No encontrado.<br><br><b>Detalle:</b> ${escapeHtml(data.error)}`, "error");
          return;
        }

        const tipo = String(data["Tipo de Certificado"] || "").trim().toLowerCase();

        let html = `<b>✅ Certificado encontrado</b><br><br>` + row("Código", data["Código"]);

        // DOCENTE PONENTE
        if (tipo.includes("docente")) {
          const titulo = String(data["Título"] || "").trim(); // Dr. / Dra.
          const nombreDoc = [titulo, data["Nombres completos"], data["Apellidos completos"]]
            .filter(Boolean)
            .map(x => String(x).trim())
            .join(" ");

          const rne = String(data["RNE"] || "").trim();
          const mostrarRne = rne && !rne.toLowerCase().includes("no registra");

          // ✅ Si Especialidad es "No registra" o vacío, NO mostrarla
          if(!isNoRegistra(data["Especialidad"])) {
            html += row("Especialidad", data["Especialidad"]);
          }

          html +=
            row("Docente", nombreDoc) +
            row("CMP", data["CMP"]) +
            (mostrarRne ? row("RNE", rne) : "") +
            rowHtml("Tema dictado", temasToListHtml(data["Tema dictado"])) +
            row("Fecha de emisión", formatFecha(data["Fecha de emisión"]));

        // COMITÉ
        } else if (tipo.includes("comité") || tipo.includes("comite")) {
          const nombre = [data["Nombres completos"], data["Apellidos completos"]]
            .filter(Boolean)
            .map(x => String(x).trim())
            .join(" ");

          html +=
            row("Miembro", nombre) +
            row("Cargo", data["Cargo"]) +
            row("Tipo de certificado", data["Tipo de Certificado"]) +
            row("Fecha de emisión", formatFecha(data["Fecha de emisión"]));

        // PARTICIPANTES
        } else {
          html +=
            row("Apellidos", data["Apellidos completos"]) +
            row("Nombres", data["Nombres completos"]) +
            row("Tipo de usuario", data["Tipo de usuario"]) +
            row("Modalidad elegida", data["Modalidad elegida"]) +
            row("Estado", data["Estado"]) +
            row("Tipo de certificado", data["Tipo de Certificado"]) +
            row("Fecha de emisión", formatFecha(data["Fecha de emisión"]));
        }

        // ✅ 1) Fondo verde para TODOS excepto "no encontrado"
        // Si es participante usamos Estado; si no, asumimos válido (ok)
        let cls = "ok";
        const estado = String(data["Estado"] || "").toLowerCase();
        if (tipo.includes("aprob") || tipo.includes("asist")) {
          cls = (estado.includes("valido") || estado.includes("válido")) ? "ok" : "error";
        } else {
          cls = "ok"; // comité/docente siempre verde si existe registro
        }

        show(html, cls);

      }catch(err){
        show("Error: no se pudo conectar con el servidor. Intente nuevamente.", "error");
      }finally{
        btn.disabled = false;
        btn.textContent = "Verificar";
      }
    }
  </script>
</body>
</html>
